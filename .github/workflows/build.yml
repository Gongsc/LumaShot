name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CONFIGURATION: Release
      PLATFORM: x64
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NATIVE_ARCHIVE: artifacts/LumaShot-native-x64-${{ github.ref_name }}.zip
      CONTROL_CENTER_ARCHIVE: artifacts/LumaShot-control-center-x64-${{ github.ref_name }}.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build native application and tests
        shell: pwsh
        run: >-
          msbuild LumaShot.sln
          /m
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=$env:PLATFORM
          /v:minimal

      - name: Build WinUI 3 control center
        shell: pwsh
        run: >-
          dotnet build src/LumaShot.ControlCenter/LumaShot.ControlCenter.csproj
          --configuration $env:CONFIGURATION
          --runtime win-x64
          -p:Platform=$env:PLATFORM
          -p:ContinuousIntegrationBuild=true
          --verbosity minimal

      - name: Run native tests
        shell: pwsh
        run: ./bin/Release/LumaShot.Tests.exe

      - name: Package release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeStage = Join-Path $env:RUNNER_TEMP 'LumaShot-native-x64'
          $controlCenterStage = Join-Path $env:RUNNER_TEMP 'LumaShot-control-center-x64'
          $controlCenterOutput = 'src/LumaShot.ControlCenter/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64'

          New-Item -ItemType Directory -Force -Path $nativeStage, $controlCenterStage, 'artifacts' | Out-Null

          Copy-Item -LiteralPath 'bin/Release/LumaShot.exe' -Destination $nativeStage
          Copy-Item -LiteralPath 'LICENSE', 'README.md', 'README.zh-CN.md' -Destination $nativeStage
          Copy-Item -LiteralPath 'docs' -Destination $nativeStage -Recurse

          Copy-Item -Path "$controlCenterOutput/*" -Destination $controlCenterStage -Recurse
          Copy-Item -LiteralPath 'LICENSE' -Destination $controlCenterStage

          Compress-Archive -Path "$nativeStage/*" -DestinationPath $env:NATIVE_ARCHIVE -Force
          Compress-Archive -Path "$controlCenterStage/*" -DestinationPath $env:CONTROL_CENTER_ARCHIVE -Force

      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: LumaShot-native-x64-${{ github.ref_name }}
          path: ${{ env.NATIVE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload WinUI 3 control center
        uses: actions/upload-artifact@v4
        with:
          name: LumaShot-control-center-x64-${{ github.ref_name }}
          path: ${{ env.CONTROL_CENTER_ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: true
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          $assets = @($env:NATIVE_ARCHIVE, $env:CONTROL_CENTER_ARCHIVE)

          & gh release view $tag --repo $repository *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $tag @assets --clobber --repo $repository
          }
          else {
            & gh release create $tag @assets --verify-tag --generate-notes --title $tag --repo $repository
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
