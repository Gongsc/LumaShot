name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CONFIGURATION: Release
      PLATFORM: x64
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare release metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $label = $env:GITHUB_REF_NAME
          }
          else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
            $label = "ci-$env:GITHUB_RUN_NUMBER"
          }

          $safeLabel = $label -replace '[^0-9A-Za-z._-]', '-'
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_LABEL=$safeLabel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STANDALONE_EXE=artifacts/LumaShot.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_BASENAME=LumaShot-$safeLabel-Setup-x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_EXE=artifacts/LumaShot-$safeLabel-Setup-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native screenshot engine and tests
        shell: pwsh
        run: >-
          msbuild LumaShot.sln
          /m
          /p:Configuration=$env:CONFIGURATION
          /p:Platform=$env:PLATFORM
          /v:minimal

      - name: Run native tests
        shell: pwsh
        run: ./bin/Release/LumaShot.Tests.exe

      - name: Publish unified standalone application
        shell: pwsh
        run: |
          dotnet publish src/LumaShot.ControlCenter/LumaShot.ControlCenter.csproj `
            --configuration $env:CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:Platform=$env:PLATFORM `
            -p:ContinuousIntegrationBuild=true `
            -p:Version=$env:VERSION `
            --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -LiteralPath 'artifacts/publish/LumaShot.exe' -Destination $env:STANDALONE_EXE -Force

      - name: Verify embedded native screenshot engine
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "LumaShot-runtime-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          try {
            $env:LUMASHOT_RUNTIME_ROOT = $runtimeRoot
            $verification = Start-Process `
              -FilePath $env:STANDALONE_EXE `
              -ArgumentList '--verify-bundle' `
              -WindowStyle Hidden `
              -Wait `
              -PassThru
            if ($verification.ExitCode -ne 0) { throw "Bundle verification failed with exit code $($verification.ExitCode)." }

            $backend = Get-ChildItem -LiteralPath $runtimeRoot -Filter 'LumaShot.Native.exe' -Recurse -File |
              Select-Object -First 1
            if (-not $backend) { throw 'The embedded native screenshot engine was not extracted.' }
          }
          finally {
            Remove-Item Env:LUMASHOT_RUNTIME_ROOT -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $runtimeRoot) {
              Remove-Item -LiteralPath $runtimeRoot -Recurse -Force
            }
          }

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler was not found.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC_PATH "/DMyAppVersion=$env:VERSION" "/DMyOutputBaseFilename=$env:SETUP_BASENAME" installer/LumaShot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:SETUP_EXE)) { throw 'Installer output was not produced.' }
          Remove-Item -LiteralPath 'artifacts/publish' -Recurse -Force

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: LumaShot-standalone-${{ env.ARTIFACT_LABEL }}-x64
          path: ${{ env.STANDALONE_EXE }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LumaShot-installer-${{ env.ARTIFACT_LABEL }}-x64
          path: ${{ env.SETUP_EXE }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: true
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          $assets = @($env:STANDALONE_EXE, $env:SETUP_EXE)

          & gh release view $tag --repo $repository *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $tag @assets --clobber --repo $repository
          }
          else {
            & gh release create $tag @assets --verify-tag --generate-notes --title $tag --repo $repository
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
