<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="700" viewBox="0 0 1080 700">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111319"/>
      <stop offset="1" stop-color="#1B1E27"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#D8D8D8"/>
      <rect width="8" height="8" fill="#BEBEBE"/>
      <rect x="8" y="8" width="8" height="8" fill="#BEBEBE"/>
