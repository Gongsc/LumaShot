  <text x="260" y="572" fill="#747B89" text-anchor="middle" font-family="Segoe UI Variable, sans-serif" font-size="12">VECTOR MASTER · 1024 PX REVIEW EXPORT</text>

  <rect x="505" y="105" width="535" height="236" rx="22" fill="#22252E" stroke="#373C48"/>
