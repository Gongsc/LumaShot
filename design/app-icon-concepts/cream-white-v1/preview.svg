  </defs>

  <rect width="1080" height="700" rx="28" fill="url(#page)"/>
  <text x="40" y="48" fill="#F7F8FA" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="24" font-weight="650">LumaShot · 应用图标候选 V1</text>
  <text x="40" y="76" fill="#969CAA" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">奶白色应用图标 · 白色捕捉光芒 · 透明托盘变体 · SVG 矢量母版</text>

